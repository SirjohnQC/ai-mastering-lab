[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mastering-lab"
version = "0.5.0"
description = "Local-first AI mastering lab starter"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
